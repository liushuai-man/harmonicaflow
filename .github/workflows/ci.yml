name: CI

# 质量门禁：类型检查 + 代码规范 + 核心逻辑自检 + 依赖体检。
# 不依赖任何密钥，PR 与主分支推送都会跑。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 类型检查 / 代码规范 / 核心自检 / 依赖体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 代码规范检查（ESLint）
        run: npm run lint

      - name: 核心逻辑自检（解析 / 编配 / 简谱 / 视觉几何）
        run: npm run verify

      - name: 依赖与配置体检
        run: npx expo-doctor